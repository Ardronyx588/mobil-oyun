<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>İlk 3D Oyunum</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #bilgi {
            position: absolute;
            top: 20px;
            width: 100%;
            font-size: 20px;
            text-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body>

    <div id="bilgi">🎮 3D Dünyama Hoş Geldin!</div>

    <!-- Three.js 3D Kütüphanesini internetten yüklüyoruz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Sahne, Kamera ve Oluşturucu (Renderer) Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 3D Nesne Oluşturma (Renkli Bir Küp)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshNormalMaterial(); // Renkli yüzeyler
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        camera.position.z = 5;

        // 3. Dokunma / Tıklama ile Hızlandırma
        let donusHizi = 0.01;
        window.addEventListener('click', () => {
            donusHizi += 0.02; // Ekrana dokundukça küp hızlanır!
        });

        // 4. Animasyon Döngüsü (Küpü Sürekli Döndür)
        function animate() {
            requestAnimationFrame(animate);

            cube.rotation.x += donusHizi;
            cube.rotation.y += donusHizi;

            renderer.render(scene, camera);
        }
        animate();

        // Ekran boyutu değişirse uyumlu hale getir
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
