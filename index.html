<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Süper Tıklama Oyunu</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f, #11111d);
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        h1 {
            font-size: 28px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            margin-bottom: 10px;
        }
        .skor-kutusu {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: #00f0ff;
        }
        #oyunBtn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff007f, #7928ca);
            border: 4px solid #fff;
            color: white;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
            touch-action: manipulation;
        }
        #oyunBtn:active {
            transform: scale(0.88);
        }
        .bilgi {
            margin-top: 30px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>🚀 Mobil Tıklama Oyunu</h1>
    <div class="skor-kutusu">Skor: <span id="skor">0</span></div>
    
    <button id="oyunBtn" onclick="tıkla()">TIKLA!</button>

    <div class="bilgi">GitHub Pages ile Canlıda!</div>

    <script>
        let skor = 0;
        function tıkla() {
            skor += 1;
            document.getElementById("skor").innerText = skor;
        }
    </script>

</body>
</html>
